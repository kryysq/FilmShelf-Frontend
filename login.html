<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmShelf - Вхід</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header"></header>
    <main class="container narrow">
        <h1>Вхід</h1>
        <div id="notice" class="alert alert-success" hidden></div>

        <form id="loginForm" class="form" novalidate>
            <div class="form-error alert alert-error" hidden></div>

            <label for="username">Ім'я користувача</label>
            <input id="username" name="username" type="text" maxlength="150" autocomplete="username" required>

            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>

            <button type="submit" class="btn btn-block">Увійти</button>
        </form>

        <p class="muted">Немає акаунта? <a id="registerLink" href="register.html">Зареєструватися</a></p>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
