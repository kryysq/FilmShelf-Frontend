<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmShelf - Додати фільм</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header"></header>
    <main class="container narrow">
        <h1>Додати фільм</h1>
        <p class="muted">Ця сторінка доступна лише авторизованим користувачам.</p>
 
        <form id="movieForm" class="form" novalidate>
            <div class="form-error alert alert-error" hidden></div>
 
            <label for="title">Назва *</label>
            <input id="title" name="title" type="text" maxlength="255" required>
 
            <label for="director">Режисер *</label>
            <select id="director" name="director" required></select>
 
            <label for="genre">Жанр *</label>
            <select id="genre" name="genre" required></select>
 
            <label for="year">Рік *</label>
            <input id="year" name="year" type="number" min="1888" max="2100" required>
 
            <label for="rating">Рейтинг (0-9.9) *</label>
            <input id="rating" name="rating" type="number" step="0.1" min="0" max="9.9" required>
 
            <label for="description">Опис</label>
            <textarea id="description" name="description" rows="3"></textarea>
 
            <label for="poster_url">Посилання на постер</label>
            <input id="poster_url" name="poster_url" type="url" maxlength="500">
 
            <button type="submit" class="btn btn-block">Зберегти</button>
        </form>
    </main>
 
    <script src="js/auth.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/add-movie.js"></script>
</body>
</html>
